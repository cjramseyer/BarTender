<!doctype html>
<html
  lang="en"
  data-theme="{{ settings.theme }}"
  data-manage-pos="{{ settings.dashboard_manage_button_position or settings.manage_button_position or 'top-right' }}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}BarTender{% endblock %} – {{ settings.bar_name }}
    </title>
    <link rel="stylesheet" href="{{ ingress }}/static/css/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a class="nav-brand" href="{{ ingress }}/">🍺 {{ settings.bar_name }}</a>
      <ul class="nav-links">
        <li><a href="{{ ingress }}/">Dashboard</a></li>
        <li><a href="{{ ingress }}/taps">Taps</a></li>
        <li><a href="{{ ingress }}/kegs">Kegs</a></li>
        {% if settings.bar_stock_enabled %}
        <li><a href="{{ ingress }}/stock">Bar Stock</a></li>
        {% endif %}
        <li><a href="{{ ingress }}/settings">⚙ Settings</a></li>
      </ul>
      <a
        class="btn btn-sm btn-secondary nav-display-btn"
        href="{{ ingress }}/display"
        target="_blank"
        rel="noopener noreferrer"
        >View Display</a
      >
    </nav>

    <main class="container">{% block content %}{% endblock %}</main>

    <script src="{{ ingress }}/static/js/app.js"></script>
    <script>
      initTheme("{{ settings.theme }}", "{{ ingress }}");
      document.body.dataset.managePos =
        document.documentElement.dataset.managePos || "top-right";
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
