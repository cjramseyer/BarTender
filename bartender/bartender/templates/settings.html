{% extends "base.html" %} {% block title %}Settings{% endblock %} {% block
content %}
<h1>⚙ Settings</h1>
<div class="card settings-card">
  <form id="settingsForm" onsubmit="saveSettings(event)">
    <div class="form-group">
      <label>Bar Name</label>
      <input
        type="text"
        id="barName"
        class="form-control"
        value="{{ settings.bar_name }}"
        required
      />
    </div>
    <div class="form-group">
      <label>Measurement System</label>
      <div class="radio-group">
        <label class="radio-label">
          <input
            type="radio"
            name="measurement"
            value="us"
            {% if (settings.measurement or 'us') == 'us' %}checked{% endif %}
          />
          US (gallons, oz)
        </label>
        <label class="radio-label">
          <input
            type="radio"
            name="measurement"
            value="metric"
            {% if (settings.measurement or 'us') == 'metric' %}checked{% endif %}
          />
          Metric (liters, ml)
        </label>
      </div>
    </div>
    <div class="form-group">
      <label>Theme</label>
      <div class="radio-group">
        <label class="radio-label">
          <input
            type="radio"
            name="theme"
            value="light"
            {% if (settings.theme or 'light') == 'light' %}checked{% endif %}
          />
          ☀ Light
        </label>
        <label class="radio-label">
          <input
            type="radio"
            name="theme"
            value="dark"
            {% if (settings.theme or 'light') == 'dark' %}checked{% endif %}
          />
          🌙 Dark
        </label>
      </div>
    </div>
    <div class="form-group">
      <label>Manage Button Position</label>
      <div class="radio-group">
        <label class="radio-label">
          <input
            type="radio"
            name="manage_button_position"
            value="top-right"
            {% if (settings.manage_button_position or 'top-right') == 'top-right' %}checked{% endif %}
          />
          Top Right
        </label>
        <label class="radio-label">
          <input
            type="radio"
            name="manage_button_position"
            value="bottom-left"
            {% if (settings.manage_button_position or 'top-right') == 'bottom-left' %}checked{% endif %}
          />
          Bottom Left
        </label>
        <label class="radio-label">
          <input
            type="radio"
            name="manage_button_position"
            value="bottom-right"
            {% if (settings.manage_button_position or 'top-right') == 'bottom-right' %}checked{% endif %}
          />
          Bottom Right
        </label>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Settings</button>
      <span id="saveMsg" class="save-msg"></span>
    </div>
  </form>
</div>

<div class="card settings-card">
  <h2>📤 Export Data</h2>
  <p class="muted">Download your bar data for backup or migration.</p>
  <div class="export-buttons">
    <a class="btn btn-secondary" href="{{ ingress }}/api/export/json"
      >Export JSON (full)</a
    >
    <a class="btn btn-secondary" href="{{ ingress }}/api/export/csv"
      >Export CSV (all)</a
    >
    <a
      class="btn btn-secondary"
      href="{{ ingress }}/api/export/csv?section=stock"
      >Export Stock CSV</a
    >
    <a
      class="btn btn-secondary"
      href="{{ ingress }}/api/export/csv?section=kegs"
      >Export Kegs CSV</a
    >
    <a
      class="btn btn-secondary"
      href="{{ ingress }}/api/export/csv?section=taps"
      >Export Taps CSV</a
    >
  </div>
</div>
{% endblock %} {% block scripts %}
<script>
  const INGRESS = "{{ ingress }}";

  async function saveSettings(e) {
    e.preventDefault();
    const measurementInput = document.querySelector(
      'input[name="measurement"]:checked'
    );
    const themeInput = document.querySelector('input[name="theme"]:checked');
    const managePosInput = document.querySelector(
      'input[name="manage_button_position"]:checked'
    );

    const body = {
      bar_name: document.getElementById("barName").value,
      measurement: measurementInput ? measurementInput.value : "us",
      theme: themeInput ? themeInput.value : "light",
      manage_button_position: managePosInput
        ? managePosInput.value
        : "top-right",
    };
    try {
      const res = await fetch(`${INGRESS}/api/settings`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        throw new Error(`Save failed: ${res.status}`);
      }

      document.getElementById("saveMsg").textContent = "✓ Saved!";
      setTimeout(() => {
        document.getElementById("saveMsg").textContent = "";
      }, 2000);
      document.documentElement.dataset.theme = body.theme;
      document.documentElement.dataset.managePos = body.manage_button_position;
      localStorage.setItem("bartender_theme", body.theme);
    } catch (err) {
      document.getElementById("saveMsg").textContent = "Save failed";
      console.error(err);
    }
  }
</script>
{% endblock %}
